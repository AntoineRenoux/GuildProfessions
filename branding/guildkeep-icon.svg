<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<!-- Guildkeep : un donjon (« keep ») d'or sur un écusson rouge sang cerclé d'or, posé sur une tuile de pierre.
	     Conçu pour rester lisible en icône d'addon (64 px) comme en avatar Discord (512 px). -->
	<defs>
		<radialGradient id="stone" cx="50%" cy="38%" r="75%">
			<stop offset="0" stop-color="#33271a"/>
			<stop offset=".6" stop-color="#17120d"/>
			<stop offset="1" stop-color="#0b0907"/>
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff3c4"/>
			<stop offset=".35" stop-color="#f2c662"/>
			<stop offset=".7" stop-color="#c8913a"/>
			<stop offset="1" stop-color="#8a5c1c"/>
		</linearGradient>
		<linearGradient id="gold-rim" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff0b8"/>
			<stop offset=".45" stop-color="#d9a446"/>
			<stop offset="1" stop-color="#7a4e16"/>
		</linearGradient>
		<radialGradient id="blood" cx="50%" cy="30%" r="80%">
			<stop offset="0" stop-color="#c3301f"/>
			<stop offset=".55" stop-color="#8e1a10"/>
			<stop offset="1" stop-color="#4a0905"/>
		</radialGradient>
		<radialGradient id="glow" cx="50%" cy="55%" r="50%">
			<stop offset="0" stop-color="#ffb347" stop-opacity=".35"/>
			<stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
		</radialGradient>
		<filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".75"/>
		</filter>
	</defs>

	<!-- Tuile de pierre, double liseré -->
	<rect x="8" y="8" width="496" height="496" rx="72" fill="#000"/>
	<rect x="14" y="14" width="484" height="484" rx="66" fill="url(#gold-rim)"/>
	<rect x="24" y="24" width="464" height="464" rx="58" fill="url(#stone)"/>
	<rect x="24" y="24" width="464" height="464" rx="58" fill="url(#glow)"/>

	<!-- Écusson : bord d'or, champ rouge -->
	<g filter="url(#drop)">
		<path d="M100 96 H412 V246 C412 352 340 414 256 446 C172 414 100 352 100 246 Z" fill="#000"/>
		<path d="M106 102 H406 V246 C406 348 337 406 256 438 C175 406 106 348 106 246 Z" fill="url(#gold-rim)"/>
		<path d="M126 122 H386 V246 C386 334 327 384 256 414 C185 384 126 334 126 246 Z" fill="url(#blood)"/>
		<!-- reflet en haut du champ -->
		<path d="M126 122 H386 V170 C320 150 192 150 126 170 Z" fill="#fff" opacity=".07"/>
	</g>

	<!-- Donjon d'or -->
	<g filter="url(#drop)">
		<!-- hampe et fanion -->
		<rect x="252" y="128" width="8" height="64" rx="3" fill="url(#gold)"/>
		<path d="M260 132 L314 146 L260 162 Z" fill="url(#gold)"/>
		<!-- créneaux -->
		<path d="M190 186 h26 v24 h12 v-24 h26 v24 h4 v-24 h26 v24 h12 v-24 h26 v40 H190 Z" fill="url(#gold)"/>
		<!-- corps -->
		<path d="M200 224 H312 V352 H200 Z" fill="url(#gold)"/>
		<!-- socle -->
		<path d="M180 348 H332 L340 372 H172 Z" fill="url(#gold)"/>
		<!-- meurtrière et porte en arc -->
		<rect x="249" y="240" width="14" height="34" rx="7" fill="#2a0806"/>
		<path d="M232 352 V312 a24 24 0 0 1 48 0 V352 Z" fill="#2a0806"/>
		<!-- joints de pierre discrets -->
		<path d="M200 288 H232 M280 288 H312 M216 256 H240 M272 256 H296" stroke="#8a5c1c" stroke-width="3" stroke-linecap="round" opacity=".55"/>
	</g>
</svg>
